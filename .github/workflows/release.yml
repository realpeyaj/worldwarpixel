name: Build & Publish Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Godot 4.7.2 + Export Templates & LLVM-MinGW
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          winget install --id GodotEngine.GodotEngine --version 4.7.2 --accept-source-agreements --accept-package-agreements --silent
          winget install --id MartinStorsjo.LLVM-MinGW.UCRT --accept-source-agreements --accept-package-agreements --silent
          $tplUrl = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          $tplZip = "$env:TEMP\godot_templates.zip"
          Invoke-WebRequest -Uri $tplUrl -OutFile $tplZip
          $dest = "$env:APPDATA\Godot\export_templates\4.7.2.stable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $tplZip -DestinationPath "$env:TEMP\godot_tpl_ext" -Force
          Copy-Item -Recurse -Force "$env:TEMP\godot_tpl_ext\templates\*" $dest

      - name: Run Go Server & Launcher Tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location server; go test -v ./...; Pop-Location
          Push-Location launcher; go test -v ./...; Pop-Location

      - name: Run Godot Headless Tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $GodotExe = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\GodotEngine.GodotEngine*\Godot_v4.7.2-stable_win64_console.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          & $GodotExe --headless --path . --import
          & $GodotExe --headless --path . res://tests/test_runner.tscn

      - name: Build Windows Launcher, Game Client & Release Archives
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -ExecutionPolicy Bypass -File .\tools\build_release.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: PATCH_NOTES.md
          files: |
            builds/release/WorldWarPixel-Windows-*.zip
            builds/release/WorldWarPixel-Client.zip
            builds/release/WorldWarPixel-Patch.zip
            builds/release/SHA256SUMS.txt
